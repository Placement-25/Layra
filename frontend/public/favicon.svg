<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="layraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B7CFF" />
      <stop offset="100%" stop-color="#55D6E8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Futuristic prism geometric icon for LAYRA -->
  <polygon points="50,12 86,32 86,68 50,88 14,68 14,32" stroke="url(#layraGrad)" stroke-width="4" fill="#0D1019" filter="url(#glow)"/>
  <polygon points="50,26 74,40 74,60 50,74 26,60 26,40" stroke="#8B7CFF" stroke-width="2" fill="none" opacity="0.6"/>
  <circle cx="50" cy="50" r="8" fill="url(#layraGrad)"/>
  <line x1="50" y1="12" x2="50" y2="42" stroke="#55D6E8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="86" y1="68" x2="58" y2="54" stroke="#8B7CFF" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="14" y1="68" x2="42" y2="54" stroke="#8B7CFF" stroke-width="2.5" stroke-linecap="round"/>
</svg>
